    <style>
      /* Splash painted before the JS bundle arrives (slow networks): brand colour + name, replaced by React. */
      html, body, #root { height: 100%; margin: 0; }
      body { background: var(--color-cream-100, #fff); }
      .splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--color-forest-800, #222); }
      .splash-name { font-family: var(--font-display, sans-serif); font-weight: var(--display-weight, 400); font-size: calc(40px * var(--display-scale, 1)); letter-spacing: var(--display-tracking, 0.02em); text-transform: var(--display-case, none); }
      .splash-sub { font: 600 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.55; }
    </style>

/* self-hosted display font (latin + latin-ext for Serbian diacritics); /leos-gyros/ is filled in by vite.config.ts.
   Russo One: straight, squared strokes close to the angular "Greek" lettering of the LEOS GYROS logo. */
@font-face {
  font-family: 'Russo One';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(/leos-gyros/fonts/russo-one-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {

  src: url(/leos-gyros/fonts/russo-one-latin.woff2) format('woff2');

}
